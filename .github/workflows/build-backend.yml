name: Build & Push Backend to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync CV from frontend/public into build context
        run: cp frontend/public/Santosh_Sapkota_CV.pdf backend/data/Santosh_Sapkota_CV.pdf

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: |
            CACHEBUST=${{ github.run_id }}
          tags: ghcr.io/${{ github.repository_owner }}/portfolio-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/portfolio-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/portfolio-backend:buildcache,mode=max

  restart-hf-space:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Factory-rebuild HF Space (re-pulls base image)
        run: |
          curl -X POST \
            "https://huggingface.co/api/spaces/hf-unstableme02/rag-chatbot/restart?factory=true" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}"
